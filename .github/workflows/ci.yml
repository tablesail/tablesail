name: CI

# The gates. Every stage is a scripts/ci.sh stage, so `scripts/ci.sh <stage>` reproduces
# a failing job on your own machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust-lint:
    name: Rust fmt and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci.sh fmt lint

  frontend:
    name: UI type-check, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/ci.sh check unit build

  rust-tests:
    name: Rust tests against all four engines
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Starts Postgres, MySQL, MariaDB and MongoDB with docker compose, waits for the seeds,
      # then runs cargo test --workspace with TABLESAIL_REQUIRE_DBS=1 (a skipped engine fails).
      - run: scripts/ci.sh rust

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # playwright.config.ts drives the installed Google Chrome.
      - run: npx playwright install --with-deps chrome
      - run: scripts/ci.sh e2e
      - name: Failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
