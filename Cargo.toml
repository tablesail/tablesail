[workspace]
resolver = "3"
members = ["src-tauri", "crates/dbcore"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
dbcore = { path = "crates/dbcore" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-native-roots",
  "postgres",
  "mysql-rsa",
  "sqlite-bundled",
] }
mongodb = "3.9"
async-trait = "0.1"
base64 = "0.23"
hex = "0.4"
csv = "1.4"
json5 = "1.3"
regex = "1.13"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
keyring = "4.2"

[profile.dev]
# Line tables keep backtraces useful at a fraction of full debug info's disk cost.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies rarely change; optimise them so debug builds of the app stay fast,
# and drop their debug info, which is most of target/'s size.
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
