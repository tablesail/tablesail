<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<title>Page not found — TableSail</title>
<link rel="icon" href="%%SITE_URL%%/favicon.svg" type="image/svg+xml">
<style>
  :root{--bg:#061419;--text:#e9f4f1;--sub:#93aeb1;--mint:#b8f0ca;--line:rgba(172,214,213,.22)}
  @media (prefers-color-scheme:light){:root{--bg:#ecf3f1;--text:#112927;--sub:#486e6e;--mint:#176e54;--line:rgba(19,70,67,.23)}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:16px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
  main{max-width:460px;text-align:center}
  .code{color:var(--mint);font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px}
  h1{font-size:clamp(34px,8vw,52px);line-height:1.1;letter-spacing:-.04em;margin:14px 0}
  p{color:var(--sub);margin:0 0 26px}
  a{display:inline-block;padding:12px 20px;border-radius:10px;border:1px solid var(--line);color:var(--text);font-weight:700;text-decoration:none}
  a:hover,a:focus-visible{border-color:var(--mint);outline:none}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>This page drifted off course.</h1>
  <p>The page you were looking for doesn't exist. The way back to TableSail is one click away.</p>
  <a href="%%SITE_URL%%/">Back to TableSail</a>
</main>
</body>
</html>
