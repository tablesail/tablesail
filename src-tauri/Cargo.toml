[package]
name = "tablesail"
description = "A fast desktop database client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "tablesail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
dbcore.workspace = true
serde.workspace = true
serde_json.workspace = true
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
tokio = { workspace = true, features = ["fs"] }
uuid.workspace = true
keyring.workspace = true
thiserror.workspace = true
# Same reqwest/rustls (ring) the updater already compiles; no second TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
